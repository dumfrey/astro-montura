{"name": "Build APK", "on": {"push": null, "workflow_dispatch": null}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Extraer proyecto", "run": "mkdir build_src && tar -xzf proyecto.tar.gz -C build_src && ls build_src"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}}, {"name": "Pruebas de astronomia", "continue-on-error": true, "working-directory": "build_src", "run": "gradle --no-daemon testDebugUnitTest"}, {"name": "Compilar APK", "working-directory": "build_src", "run": "gradle --no-daemon assembleDebug"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "AstroMontura-apk", "path": "build_src/app/build/outputs/apk/debug/app-debug.apk"}}, {"name": "Publicar release", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "apk-${{ github.run_number }}", "name": "AstroMontura APK ${{ github.run_number }}", "files": "build_src/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
